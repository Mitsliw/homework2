<!DOCTYPE html>
<html>
    <body>
        <header><h2>Регистрация</h2></header>
        <main>
            <form style="border: 2px double black;">
                <fieldset>
                <p>
                    <label>Введите имя:</label>
                    <input type="text" required style="width: 6cm;">
                </p>
                <p>
                    <label>Введите фамилию:</label>
                    <input type="text" required style="width: 5cm;">
                </p>
                <p>
                    <label>Введите email:</label>
                    <input type="email" required style="width: 5.7cm;">
                </p>
                <p>
                    <label>Введите телефон:</label>
                    <input type="tel" required style="width: 5.1cm;">
                </p>
                <p>
                    <label>Введите пароль:</label>
                    <input type="password" required style="width: 5.3cm;"><br>
                    <label></label>Потвердите пароль:
                    <input type="password" required style="width: 4.7cm;">
                </p>
                <p>
                    <label>Введите дату рождения:</label>
                    <input type="date" required>
                </p>
                <p>
                    <label>Укажите пол:</label><br>
                    <input type="radio" name="gender">Мужской<br>
                    <input type="radio" name="gender">Женский
                </p>
                <p>
                    <label>Согласие на регистрацию:</label>
                    <input type="checkbox" required>
                </p>
                <p>                 
                    <input type="submit" value="Готово">
                </p>
                <p>                 
                    <input type="reset" value="Очистить">
                </p>
                </fieldset>
            </form>
            <p><h3>Фильтры</h3></p>
            <form>
                <fieldset>
                    <p>
                        <label>Поиск:</label>
                        <input type="search">
                    </p>
                    <p>
                        <label>Категория:</label>
                        <select name="Category" required>
                            <option>Имиджевые</option>
                            <option>Рекламные</option>
                            <option>Периодические</option>
                        </select>
                    </p>
                    <p>
                        <label>Сортировка:</label>
                        <select name="Sort">
                            <option>По возрастанию</option>
                            <option>По убыванию</option>                         
                        </select>
                    </p>
                    <p>
                        <label>Диапазон цен:</label>
                        <input type="range" min="1200" max="50000" >
                    </p>
                    <p>
                        <label>Исключить из поиска:</label><br>
                        <input type="checkbox" name="ch1">Имиджевые<br>
                        <input type="checkbox" name="ch2">Рекламные<br>
                        <input type="checkbox" name="ch3">Периодические
                    </p>
                    <p>
                        <label>Потвердить?</label><br>
                        <input type="radio" name="rad1">Да<br>
                        <input type="radio" name="rad1">Нет
                    </p>
                    <p>                 
                        <input type="submit" value="Применить">
                    </p>
                    <p>                 
                        <input type="reset" value="Очистить">
                    </p>                                                        
                </fieldset>
            </form>
            <p><h3>Обратная связь</h3></p>
            <form>
                <fieldset>
                    <p>
                    <label>Введите имя:</label>
                    <input type="text" required>
                    </p>
                    <p>
                    <label>Введите email:</label>
                    <input type="email" required>
                    </p>
                    <p>
                        <label>Введите причину обращения:</label>
                        <input type="text" required>
                    </p>
                    <textarea placeholder="Опишите проблему" rows="15" cols="40" required></textarea>
                     <p>
                    <label>Приоритет сообщения:</label><br>
                    <input type="radio" name="priority">Сверхважно<br>
                    <input type="radio" name="priority">Важно<br>
                    <input type="radio" name="priority">Могу подожать
                </p>
                <p>
                    <label>Приложить файл</label>
                    <input type="file">
                </p>
                <p>
                <input type="submit" value="Отправить">
                </p>
                </fieldset>
            </form>
            <p><h3>Анкета</h3></p>
            <form>
                <fieldset>
                    <p>
                    <legend><h5>Личные данные</h5></legend>
                    <label>Введите имя:</label>
                    <input type="text" required>
                    </p>
                    <p>
                    <label>Введите фамилию:</label>
                    <input type="text" required>
                    </p>
                    <p>
                    <label>Возраст:</label>
                    <input type="number" required>
                    </p>
                    <p>
                    <legend><h5>Контакты</h5></legend>
                    <label>Введите email:</label>
                    <input type="email" required>
                    </p>
                    <p>
                    <label>Введите телефон:</label>
                    <input type="tel" required>
                    </p>                 
                    <p>
                        <legend><h5>Предпочтения</h5></legend>
                        <label>Где нравится работать</label><br>
                        <input type="checkbox" name="work">Дома<br>
                        <input type="checkbox" name="work">В офисе<br>
                        <input type="checkbox" name="work">Без разницы
                    </p>
                    <p>                     
                        <label>Кто круче</label><br>
                        <input type="checkbox" name="pet">Собаки<br>
                        <input type="checkbox" name="pet">Кошки
                    </p>
                    <p>
                        <label>Приложить фото питомца</label>
                        <input type="file">
                    </p>
                    <p>
                        <legend><h5>Дополнительная информация</h5></legend>
                        <textarea rows="15" cols="40"></textarea>
                    </p>
                    <p>
                        <label>Удовлетвореность анкетой</label>
                        <input type="range" min="0" max="100">
                    </p>
                    <p>
                        <label>Потвердить?</label><br>
                        <input type="radio" name="rad1">Да<br>
                        <input type="radio" name="rad1">Нет
                    </p>
                    <p>
                        <input type="submit" value="Отправить">
                    </p>
                    <p>                 
                        <input type="reset" value="Очистить">
                    </p>
                </fieldset>
            </form>
        </main>
    </body>
</html>
